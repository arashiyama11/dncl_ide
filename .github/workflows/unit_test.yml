name: Unit Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-java

      - name: Unit Test
        run: ./gradlew clean desktopTest --stacktrace --no-daemon

