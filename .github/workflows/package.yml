name: Release on tag (build & upload artifacts)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=${TAG}" >&2
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create draft release for tag
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release created by workflow for tag ${{ github.ref_name }}.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-linux:
    needs: create_release
    runs-on: ubuntu-latest
    env:
      APK_PATH: composeApp/build/outputs/apk/release/composeApp-release.apk
      JAR_PATH: interpreter/build/libs/interpreter-all.jar
      LINUX_NATIVE_PATH: interpreter/build/bin/linuxArm64/releaseExecutable/interpreter.kexe
      DESKTOP_PATH: composeApp/build/compose/binaries/main/deb/io.github.arashiyama11.dncl-ide_${{ needs.create_release.outputs.version }}-1_amd64.deb
      LS_PATH: language_server/build/libs/language_server-desktop-all.jar
      KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK & Gradle
        uses: ./.github/actions/setup-java
        with:
          java-version: "17"

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${KEYSTORE_PATH}"
            ls -l "${KEYSTORE_PATH}"
          else
            echo "No KEYSTORE_BASE64 secret present, skipping keystore restore"
          fi

      - name: Package APKs
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleDebug assembleRelease -q --console=plain

      - name: Package CLI Jar
        run: ./gradlew interpreter:fatJar -q --console=plain

      - name: Package Native CLI (linux)
        run: ./gradlew interpreter:linuxArm64Binaries -q --console=plain

      - name: Package Desktop App
        run: |
          ./gradlew composeApp:packageDeb -q --console=plain

      - name: Package LS
        run: ./gradlew createJsonRpcServerJar -q --console=plain

      - name: Upload APK to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.APK_PATH }}
          asset_name: dncl-ide-android-universal-${{ needs.create_release.outputs.version }}-release.apk
          asset_content_type: application/vnd.android.package-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.JAR_PATH }}
          asset_name: interpreter-${{ needs.create_release.outputs.version }}-all.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux native to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.LINUX_NATIVE_PATH }}
          asset_name: dncl-cli-linux-amd64-${{ needs.create_release.outputs.version }}.kexe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop package to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.DESKTOP_PATH }}
          asset_name: dncl-ide-linux-amd64-${{ needs.create_release.outputs.version }}.deb
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Language Server JAR to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.LS_PATH }}
          asset_name: language-server-${{ needs.create_release.outputs.version }}-all.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-macos:
    needs: create_release
    runs-on: macos-latest
    env:
      MAC_NATIVE_PATH: interpreter/build/bin/macosArm64/releaseExecutable/interpreter.kexe
      MAC_DESKTOP_DMG: composeApp/build/compose/binaries/main/dmg/io.github.arashiyama11.dncl_ide-${{ needs.create_release.outputs.version }}.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK & Gradle
        uses: ./.github/actions/setup-java

      - name: Package Native Cli (macos)
        run: |
          ./gradlew interpreter:macosArm64Binaries -q --console=plain

      - name: Package Desktop App (dmg)
        run: |
          ./gradlew packageDmg -q --console=plain

      - name: Upload mac native to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.MAC_NATIVE_PATH }}
          asset_name: dncl-cli-macos-arm64-${{ needs.create_release.outputs.version }}.kexe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload mac artifact to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.MAC_DESKTOP_DMG }}
          asset_name: dncl-ide-macos-arm64-${{ needs.create_release.outputs.version }}.dmg
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-windows:
    needs: create_release
    runs-on: windows-latest
    env:
      WIN_NATIVE_PATH: interpreter\\build\\bin\\mingwX64\\releaseExecutable\\interpreter.exe
      WIN_DESKTOP_MSI: composeApp\\build\\compose\\binaries\\main\\msi\\io.github.arashiyama11.dncl_ide-${{ needs.create_release.outputs.version }}.msi
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK & Gradle
        uses: ./.github/actions/setup-java

      - name: Package Native Cli (windows)
        shell: pwsh
        run: |
          .\gradlew interpreter:mingwX64Binaries -q --console=plain

      - name: Package Desktop App (msi)
        shell: pwsh
        run: |
          .\gradlew composeApp:packageMsi -q --console=plain

      - name: Upload windows artifact to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.WIN_NATIVE_PATH }}
          asset_name: dncl-cli-windows-x86_64-${{ needs.create_release.outputs.version }}.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload windows msi to release
        if: ${{ needs.create_release.outputs.upload_url }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ env.WIN_DESKTOP_MSI }}
          asset_name: dncl-ide-windows-x86_64-${{ needs.create_release.outputs.version }}.msi
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
