<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNCL IDE</title>
    <meta name="description" content="DNCL IDE">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="editor-root" style="position:relative; width:100%; height:100vh;">
    <div id="compose-canvas" class="editor-layer"
         style="position:absolute; width:80%; height:100vh;"></div>
    <div id="monaco-editor" class="editor-layer"
         style="position:absolute; width:80%; height:100vh; overflow:hidden"></div>
    <div id="controller"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-languageclient@10.1.0/lib/index.min.js"></script>
<script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' }}); require(['vs/editor/editor.main'], function() { editor = monaco.editor.create(document.getElementById("monaco-editor"), { value: '// ここにコードを入力します\nfunction hello() {\n console.log("Hello, world!");\n}', language: 'javascript' }); window.monaco = editor; });
</script>
</body>
</html>
